name: Prüfen
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with: { php-version: '8.1' }
      # CVE-2026-111497: Node 20 ist EOL. Der Patchstand ist absichtlich exakt
      # festgelegt, damit jeder Prüflauf eine bekannte, unterstützte Runtime nutzt.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: { node-version: '24.22.1' }
      - run: find mgd-share-wordpress -name '*.php' -exec php -l {} \;
      - run: node --check mgd-share-wordpress/assets/share.js
      - run: python3 scripts/check-docs.py
      - run: python3 scripts/build-package.py
