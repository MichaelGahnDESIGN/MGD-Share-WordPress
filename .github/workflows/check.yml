name: Prüfen
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with: { php-version: '8.1' }
      # CVE-2026-111497: Node 20 ist EOL. Der Patchstand ist absichtlich exakt
      # festgelegt, damit jeder Prüflauf eine bekannte, unterstützte Runtime nutzt.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24.22.1' }
      - run: find mgd-share-wordpress -name '*.php' -exec php -l {} \;
      - run: node --check mgd-share-wordpress/assets/share.js && node --check mgd-share-wordpress/assets/admin.js
      - run: php tests/share-options.php && php tests/catalog-package.php
      - run: node --check mgd-share-wordpress/includes/Kit/Platform/WordPress/assets/kit-catalog.js
      - run: python3 scripts/check-docs.py
      - run: python3 scripts/build-package.py
